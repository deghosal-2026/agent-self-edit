name: CI

on:
  push:
    branches: [main, feat-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src/agent_self_edit/
      # TODO: restore --cov-fail-under=92 when coverage gap is closed (tracking #183)
      - run: pytest --ignore=tests/test_docker.py --cov=agent_self_edit --cov-report=term-missing --cov-fail-under=81

  docker:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-self-edit .
      - run: docker run agent-self-edit --help