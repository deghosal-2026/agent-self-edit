# Mixed-domain task set — 30 cross-domain tasks (expanded for v0.2.0)
# These tasks span classification + extraction + generation domains
# They test whether the analyzer can propose edits that handle cross-domain cases
- id: "mixed-001"
  input: "Classify this ticket AND extract the affected service: 'The payment gateway is returning 502 errors for all enterprise customers. This started at 14:00 UTC.'"
  expected_output: "classification: urgent, technical\naffected_service: payment gateway"
  metadata: {scorer: "contains", difficulty: "hard", tags: [classification, extraction, cross-domain], benchmark_role: "promotion_ab"}
- id: "mixed-002"
  input: "Classify this ticket AND generate a one-line summary for the dashboard: 'User reports their API key was leaked on GitHub. They need it revoked immediately.'"
  expected_output: "classification: security, urgent\nsummary: API key leaked on GitHub, revocation requested"
  metadata: {scorer: "contains", difficulty: "hard", tags: [classification, generation, cross-domain], benchmark_role: "promotion_ab"}
- id: "mixed-003"
  input: "Extract the error code from this text AND classify the severity: 'Error E5001 occurred in the billing module. 3,400 customers affected. Estimated revenue impact: $12K/hour.'"
  expected_output: "error_code: E5001\nseverity: urgent"
  metadata: {scorer: "contains", difficulty: "hard", tags: [extraction, classification, cross-domain], benchmark_role: "promotion_ab"}
