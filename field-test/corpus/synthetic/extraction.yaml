# Extraction task set — 25 tasks, Contains scorer
# Extract structured fields from unstructured text
# Edge cases: missing fields, wrong format, extra fields, nested, multi-entity, conflicting info
- id: "extract-001"
  input: "My name is Alice Johnson and my email is alice@example.com."
  expected_output: "name: Alice Johnson\nemail: alice@example.com"
  metadata: {scorer: "contains", difficulty: "easy", tags: [contact]}
- id: "extract-002"
  input: "The incident occurred on 2026-08-15 at 14:30 UTC. Severity: HIGH. Service: api-gateway."
  expected_output: "date: 2026-08-15\ntime: 14:30 UTC\nseverity: HIGH\nservice: api-gateway"
  metadata: {scorer: "contains", difficulty: "easy", tags: [incident]}
- id: "extract-003"
  input: "The deployment sha is abc123def456 and the version is v2.1.3."
  expected_output: "sha: abc123def456\nversion: v2.1.3"
  metadata: {scorer: "contains", difficulty: "easy", tags: [deployment]}
- id: "extract-004"
  input: "Contact John at john.doe@company.com or call +1-555-0123."
  expected_output: "name: John Doe\nemail: john.doe@company.com\nphone: +1-555-0123"
  metadata: {scorer: "contains", difficulty: "medium", tags: [contact]}
- id: "extract-005"
  input: "The build failed with error code E4032 on branch feature/new-auth."
  expected_output: "error: E4032\nbranch: feature/new-auth"
  metadata: {scorer: "contains", difficulty: "easy", tags: [ci]}
- id: "extract-006"
  input: "Server srv-web-03 has 78% CPU usage and 12GB of 16GB RAM in use."
  expected_output: "server: srv-web-03\ncpu: 78%\nram: 12GB\nram_total: 16GB"
  metadata: {scorer: "contains", difficulty: "medium", tags: [infra]}
