  input: "The JIRA ticket OPS-4567 was opened by mike@corp.com on 2026-09-01."
  expected_output: "ticket: OPS-4567\nreporter: mike@corp.com\ndate: 2026-09-01"
  metadata: {scorer: "contains", difficulty: "easy", tags: [ticketing]}
