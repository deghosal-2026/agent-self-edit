# --- Conflicting info tasks (2) ---
- id: "extract-024"
  input: "The meeting is scheduled for 2026-09-15. Wait, actually it was moved to 2026-09-20. The original date was 2026-09-15."
  expected_output: "meeting_date: 2026-09-20\noriginal_date: 2026-09-15"
  metadata: {scorer: "contains", difficulty: "hard", tags: [conflicting, ambiguous]}
- id: "extract-025"
  input: "The server has 16GB RAM according to the spec sheet, but monitoring shows only 12GB allocated. The spec says 16GB."
  expected_output: "spec_ram: 16GB\nactual_ram: 12GB"
  metadata: {scorer: "contains", difficulty: "hard", tags: [conflicting, infra]}