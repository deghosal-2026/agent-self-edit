# --- Nested field tasks (5) ---
- id: "extract-016"
  input: "Alice Johnson lives at 123 Main St, Springfield, IL 62704. Her manager is Bob Smith."
  expected_output: "name: Alice Johnson\naddress: 123 Main St\ncity: Springfield\nstate: IL\nzip: 62704\nmanager: Bob Smith"
  metadata: {scorer: "contains", difficulty: "hard", tags: [nested, contact]}
- id: "extract-017"
  input: "The server db-prod-01 is in datacenter us-east-1, rack R12, slot 4. IP: 10.0.12.34."
  expected_output: "server: db-prod-01\ndatacenter: us-east-1\nrack: R12\nslot: 4\nip: 10.0.12.34"
  metadata: {scorer: "contains", difficulty: "hard", tags: [nested, infra]}
- id: "extract-018"
  input: "Customer Acme Corp (ID: AC-4521) has 3 subscriptions: Pro ($99/mo), Enterprise ($499/mo), and Add-on ($25/mo)."
  expected_output: "customer: Acme Corp\ncustomer_id: AC-4521\npro: $99/mo\nenterprise: $499/mo\naddon: $25/mo"
  metadata: {scorer: "contains", difficulty: "hard", tags: [nested, billing]}
- id: "extract-019"
  input: "The pipeline deploy-prod has 4 stages: build (2m), test (5m), scan (1m), deploy (30s). Status: failed at scan."
  expected_output: "pipeline: deploy-prod\nbuild: 2m\ntest: 5m\nscan: 1m\ndeploy: 30s\nfailed_at: scan"
  metadata: {scorer: "contains", difficulty: "hard", tags: [nested, ci]}
- id: "extract-020"
  input: "Alert: CPU > 90% on web-03. Triggered at 14:22. Resolved at 14:35 by scaling to 4 replicas."
  expected_output: "alert: CPU\nthreshold: 90%\nserver: web-03\ntriggered: 14:22\nresolved: 14:35\naction: scaled to 4 replicas"
